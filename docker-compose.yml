version: "3.9"

services:
  backend:
    build: .
    container_name: oftisoft-backend

    restart: always

    env_file:
      - ./.env

    environment:
      - NODE_ENV=production
      - PORT=5500

    ports:
      - "5500:5500"

    networks:
      - oftisoft-network

  nginx:
    image: nginx:alpine
    container_name: oftisoft-nginx

    restart: always

    ports:
      - "8090:80"
      - "8444:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot

    depends_on:
      - backend

    networks:
      - oftisoft-network

  certbot:
    image: certbot/certbot
    container_name: oftisoft-certbot

    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot

networks:
  oftisoft-network:

volumes:
  certbot-data:
  certbot-www: