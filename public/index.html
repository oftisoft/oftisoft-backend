<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oftisoft API - Backend Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem 4rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #e0e0e0;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.75rem 1.5rem;
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(46, 204, 113, 0.3);
            margin-bottom: 2rem;
        }
        
        .status::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .api-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .api-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #4facfe;
        }
        
        .endpoints {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        
        .endpoint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .method {
            background: #4facfe;
            color: #1a1a2e;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .path {
            color: #00f2fe;
            font-family: monospace;
            font-size: 0.95rem;
        }
        
        .footer {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .footer a {
            color: #4facfe;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>Oftisoft API</h1>
        <p class="subtitle">Backend Server is running successfully</p>
        
        <div class="status">System Operational</div>
        
        <div class="api-section">
            <h2>Available Endpoints</h2>
            <div class="endpoints">
                <div class="endpoint">
                    <span class="method">GET</span>
                    <span class="path">/health</span>
                </div>
                <div class="endpoint">
                    <span class="method">POST</span>
                    <span class="path">/auth/login</span>
                </div>
                <div class="endpoint">
                    <span class="method">POST</span>
                    <span class="path">/auth/register</span>
                </div>
                <div class="endpoint">
                    <span class="method">GET</span>
                    <span class="path">/api/v1/users</span>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Ready to accept connections • Port 5500 • <a href="https://api.oftisoft.com">api.oftisoft.com</a></p>
            <p style="margin-top: 10px;">© 2026 Oftisoft. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
